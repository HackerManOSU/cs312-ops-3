---
- name: Configure Minecraft server from ECR image
  hosts: minecraft
  become: true

  vars:
    data_dir: /data
    container_name: minecraft
    image_uri: "{{ ecr_repo_uri }}:{{ image_tag }}"

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install runtime prerequisites
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-pip
          - curl
          - unzip
        state: present

    - name: Check if AWS CLI is already installed
      ansible.builtin.command:
        cmd: aws --version
      register: aws_cli_check
      changed_when: false
      failed_when: false

    - name: Download AWS CLI v2 installer
      ansible.builtin.get_url:
        url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
        dest: /tmp/awscliv2.zip
        mode: "0644"
      when: aws_cli_check.rc != 0

    - name: Unzip AWS CLI v2 installer
      ansible.builtin.unarchive:
        src: /tmp/awscliv2.zip
        dest: /tmp
        remote_src: true
      when: aws_cli_check.rc != 0

    - name: Install AWS CLI v2
      ansible.builtin.command:
        cmd: /tmp/aws/install
      when: aws_cli_check.rc != 0

    - name: Verify AWS CLI installation
      ansible.builtin.command:
        cmd: aws --version
      changed_when: false

    - name: Install Docker SDK for Python
      ansible.builtin.pip:
        name: docker
        state: present
        break_system_packages: true

    - name: Ensure Docker service is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create Minecraft data directory
      ansible.builtin.file:
        path: "{{ data_dir }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"

    - name: Check whether S3 backup exists
      ansible.builtin.command:
        cmd: "aws s3 ls s3://{{ backup_bucket }}/minecraft/ --region {{ aws_region }}"
      register: s3_backup_check
      changed_when: false
      failed_when: false

    - name: Restore world data from S3 if backup exists
      ansible.builtin.command:
        cmd: "aws s3 sync s3://{{ backup_bucket }}/minecraft/ {{ data_dir }}/ --region {{ aws_region }}"
      when: s3_backup_check.rc == 0
      changed_when: true

    - name: Log in to ECR using instance profile credentials
      ansible.builtin.shell: |
        aws ecr get-login-password --region {{ aws_region }} \
        | docker login --username AWS --password-stdin {{ ecr_repo_uri.split('/')[0] }}
      changed_when: false

    - name: Pull pinned Minecraft image from ECR
      community.docker.docker_image:
        name: "{{ image_uri }}"
        source: pull
        force_source: true

    - name: Start Minecraft server container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_uri }}"
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "25565:25565"
        volumes:
          - "{{ data_dir }}:/data"
        env:
          EULA: "TRUE"
          MOTD: "{{ minecraft_motd }}"
          MEMORY: "2G"
          SERVER_PORT: "25565"
          VERSION: "1.21.1"

    - name: Wait for Minecraft server to initialize
      ansible.builtin.shell: |
        for i in $(seq 1 18); do
          docker logs {{ container_name }} 2>&1 | grep -q "Done" && exit 0
          sleep 10
        done
        docker logs {{ container_name }}
        exit 1
      changed_when: false